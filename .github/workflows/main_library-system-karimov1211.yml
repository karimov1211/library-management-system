# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - library-system-karimov1211

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
      
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "antenv/*" ".git/*" ".github/*"
      
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2F6172828BF54B018C39EA8A6027F5F2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_84523DD21F534B3E8FC51A6CACCC5A2F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DEE75CAEF33F41918C85B32AA8B1C23A }}

      - name: Configure Azure App Settings via CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set --resource-group librarygroup --name library-system-karimov1211 --settings AZURE_SQL_SERVER="library-server-karimov1211.database.windows.net" AZURE_SQL_DATABASE="LibraryDB" AZURE_SQL_USERNAME="dbadmin" AZURE_SQL_PASSWORD="AzurePassword123!" AZURE_SQL_DRIVER="{ODBC Driver 17 for SQL Server}" SECRET_KEY="kutubxona-tizimi-maxfiy-kalit-2026" SCM_DO_BUILD_DURING_DEPLOYMENT=true
            az webapp config set --resource-group librarygroup --name library-system-karimov1211 --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 -w 4 -k uvicorn.workers.UvicornWorker main:app"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'library-system-karimov1211'

      - name: Fetch Azure Logs to Debug Application Error
        if: always()
        uses: azure/cli@v2
        with:
          inlineScript: |
            sleep 15
            az webapp log download --resource-group librarygroup --name library-system-karimov1211
            unzip -o download.zip -d azure_logs
            echo "--- DOCKER LOGS ---"
            cat azure_logs/LogFiles/*.log 2>/dev/null || true
            cat azure_logs/LogFiles/docker/*.log 2>/dev/null || true
            echo "--- END DOCKER LOGS ---"